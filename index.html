<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>[Prototype] Referrals finder</title>
<style>
:root{--ink:#1a1a1a;--soft:#4a4a4a;--line:#d4d4d4;--navy:#1f3a5f;--accent:#2a63d6;--page:#fdf8fb}
body{margin:0;background:var(--page);color:var(--ink);font-family:Verdana,Geneva,"DejaVu Sans",sans-serif;font-size:15px;line-height:1.5}
.strip{background:#fff4c2;border-bottom:1px solid #e6d27a;padding:10px 16px;font-size:13px}
main{max-width:640px;margin:0 auto;padding:48px 16px}
h1{font-size:22px;line-height:1.3;margin:0 0 12px;color:var(--navy)}
p{margin:0 0 32px;color:var(--soft)}
ul{list-style:none;margin:0;padding:0;display:grid;gap:16px}
a{display:block;padding:20px 24px;background:#fff;border:2px solid var(--navy);border-radius:8px;color:var(--navy);text-decoration:none}
a b{display:block;font-size:17px}
a span{display:block;margin-top:4px;font-size:13px;color:var(--soft)}
a:hover b{text-decoration:underline}
a:focus{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="strip">A prototype for testing, not the live NYDHR website.</div>
<main>
<h1>Referrals finder prototype</h1>
<p>Choose which version to try.</p>
<ul>
<li><a href="public"><b>Public</b><span>For people whose report NYDHR can't take: find other help.</span></a></li>
<li><a href="staff"><b>Staff</b><span>For NYDHR staff: find help from the LOJ reason on a caller's letter.</span></a></li>
</ul>
</main>
</body>
</html>
